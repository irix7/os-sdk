name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-03
          components: rust-src, rustfmt, clippy, llvm-tools
      - name: Format
        run: |
          cargo fmt --all -- --check
          rustfmt --edition 2021 --check \
            examples/user-hello/src/main.rs \
            examples/user-probe/src/main.rs \
            templates/user/src/main.rs
      - name: Clippy (SDK libraries)
        run: cargo clippy -p module-abi -p irix7-module-sdk -p irix7-user-abi -p irix7-user-sdk --all-targets -- -D warnings
      - name: Host tests
        run: |
          cargo test -p irix7-user-abi -p irix7-user-sdk
          python3 tools/tests/test_user_target.py
      - name: Build the hello module
        run: python3 tools/irix7-module.py --package hello-sdk --output /tmp/hello-sdk.module --json > /tmp/hello-sdk.json
      - name: Check the hello JSON result
        run: |
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/hello-sdk.json'))
          assert data['size'] > 0
          assert len(data['sha256']) == 64
          print('json ok:', data['size'], 'bytes')
          PY
      - name: Build the ticker module
        run: python3 tools/irix7-module.py --package ticker-sdk --output /tmp/ticker-sdk.module
      - name: Build the block module
        run: python3 tools/irix7-module.py --manifest-path examples/block/Cargo.toml --package block-sdk --linker examples/block/linker.ld --output /tmp/block-sdk.module --json > /tmp/block-sdk.json
      - name: Check the block JSON result
        run: |
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/block-sdk.json'))
          assert data['size'] > 0
          assert len(data['sha256']) == 64
          print('block json ok:', data['size'], 'bytes')
          PY
      - name: Inspect the module images
        run: |
          ls -l /tmp/hello-sdk.module /tmp/block-sdk.module
          sha256sum /tmp/hello-sdk.module /tmp/block-sdk.module
          python3 - <<'PY'
          from pathlib import Path
          for name in ('hello-sdk', 'block-sdk'):
              data = Path(f'/tmp/{name}.module').read_bytes()
              assert 0 < len(data) <= 2 * 1024 * 1024, f'{name} image size out of range'
              print('flat image ok:', name, len(data), 'bytes')
          PY
      - name: Build the user hello image
        run: python3 tools/irix7-user.py --package user-hello-sdk --output /tmp/user-hello.elf --image /tmp/user-hello.raw --json > /tmp/user-hello.json
      - name: Build the user probe image
        run: python3 tools/irix7-user.py --manifest-path examples/user-probe/Cargo.toml --package user-probe-sdk --output /tmp/user-probe.elf --image /tmp/user-probe.raw --json > /tmp/user-probe.json
      - name: Check the user JSON result
        run: |
          python3 - <<'PY'
          import json
          for name in ('user-hello', 'user-probe'):
              data = json.load(open(f'/tmp/{name}.json'))
              assert data['elf_size'] > 0
              assert data['image_size'] == 256 * 1024
              assert data['entry'] == '0x10000000'
              assert len(data['sha256']) == 64
              print('user image ok:', name, data['elf_size'], 'bytes ->', data['image_size'])
          PY
      - name: Validate the user ELF and target-2 image
        run: |
          IRIX7_USER_ELF=/tmp/user-hello.elf IRIX7_USER_IMAGE=/tmp/user-hello.raw python3 tools/tests/test_user_image.py
          IRIX7_USER_ELF=/tmp/user-probe.elf IRIX7_USER_IMAGE=/tmp/user-probe.raw python3 tools/tests/test_user_image.py
      - name: Inspect the user images
        run: |
          ls -l /tmp/user-hello.elf /tmp/user-hello.raw /tmp/user-probe.elf /tmp/user-probe.raw
          readelf -h /tmp/user-hello.elf | grep -E 'Class|Data|Type|Machine|Entry point'
          sha256sum /tmp/user-hello.raw /tmp/user-probe.raw
