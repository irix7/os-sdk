name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-03
          components: rust-src, rustfmt, clippy, llvm-tools
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (SDK library)
        run: cargo clippy -p module-abi -p irix7-module-sdk --all-targets -- -D warnings
      - name: Build the hello module
        run: python3 tools/irix7-module.py --package hello-sdk --output /tmp/hello-sdk.module --json > /tmp/hello-sdk.json
      - name: Check the hello JSON result
        run: |
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/hello-sdk.json'))
          assert data['size'] > 0
          assert len(data['sha256']) == 64
          print('json ok:', data['size'], 'bytes')
          PY
      - name: Build the ticker module
        run: python3 tools/irix7-module.py --package ticker-sdk --output /tmp/ticker-sdk.module
      - name: Build the block module
        run: python3 tools/irix7-module.py --manifest-path examples/block/Cargo.toml --package block-sdk --linker examples/block/linker.ld --output /tmp/block-sdk.module --json > /tmp/block-sdk.json
      - name: Check the block JSON result
        run: |
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/block-sdk.json'))
          assert data['size'] > 0
          assert len(data['sha256']) == 64
          print('block json ok:', data['size'], 'bytes')
          PY
      - name: Inspect the image
        run: |
          ls -l /tmp/hello-sdk.module /tmp/block-sdk.module
          sha256sum /tmp/hello-sdk.module /tmp/block-sdk.module
          python3 - <<'PY'
          from pathlib import Path
          for name in ('hello-sdk', 'block-sdk'):
              data = Path(f'/tmp/{name}.module').read_bytes()
              assert 0 < len(data) <= 2 * 1024 * 1024, f'{name} image size out of range'
              print('flat image ok:', name, len(data), 'bytes')
          PY
