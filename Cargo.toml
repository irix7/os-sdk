[workspace]
resolver = "2"
members = [
    "abi",
    "wasm-abi",
    "manifest",
    "module-sdk",
    "user-abi",
    "user-sdk",
    "examples/hello",
    "examples/ticker",
    "examples/block",
]
exclude = [
    "template",
    "templates/user",
    "examples/user-hello",
    "examples/user-probe",
    "examples/wasm-hello",
]
default-members = ["module-sdk", "user-sdk"]

[profile.dev]
panic = "abort"
opt-level = 0

[profile.release]
panic = "abort"
opt-level = 2
